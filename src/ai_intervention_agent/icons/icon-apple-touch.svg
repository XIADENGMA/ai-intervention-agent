<svg width="180" height="180" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!--
    Source of apple-touch-icon.png, the tile iOS uses for "Add to Home Screen".
    Differences from src/ai_intervention_agent/icons/icon.svg:
      1. Full-bleed opaque square: the background gradient fills the whole 120x120 canvas, with no
         margin, no rounded corners, no drop shadow and no hairline border. iOS cuts its own rounded
         mask and paints every transparent pixel of the PNG black. icon.svg draws a rounded plate
         inset by 10 units, so rendering it as is leaves a ring of transparent pixels that turns
         into a black frame around the icon.
      2. Glyph scale 1.14 = icon.svg's 0.95 x (120 / 100). The plate of icon.svg spans 100 of 120
         units and here the plate is the whole canvas, so the glyph keeps its proportion to the plate.
      3. Static: no animateTransform and no data-particle dust, as in icon-maskable.svg.
    Every colour here is fully opaque; scripts/generate_pwa_icons.py refuses to write this icon
    otherwise.
  -->
  <defs>
    <linearGradient id="appleTouchBg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#E8ECF5;" />
      <stop offset="100%" style="stop-color:#DEE4F1;" />
    </linearGradient>

    <radialGradient id="aiFluidCoreA" cx="50%" cy="50%" r="70%" fx="52%" fy="48%">
      <stop offset="0%" style="stop-color:#A855F7; stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#8B5CF6; stop-opacity:0.95"/>
      <stop offset="60%" style="stop-color:#6366F1; stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#312E81; stop-opacity:0.85"/>
    </radialGradient>

    <linearGradient id="interventionControlA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDE047;"/>
      <stop offset="30%" style="stop-color:#FACC15;"/>
      <stop offset="70%" style="stop-color:#EAB308;"/>
      <stop offset="100%" style="stop-color:#CA8A04;"/>
    </linearGradient>

    <filter id="aiCoreGlowEffectA">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feFlood flood-color="#A5B4FC" flood-opacity="0.6" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow_colored"/>
      <feMerge>
        <feMergeNode in="softGlow_colored"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="interventionShadowA" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0.5" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect x="0" y="0" width="120" height="120" fill="url(#appleTouchBg)"/>

  <g transform="translate(60,60) scale(1.14)">
    <g filter="url(#aiCoreGlowEffectA)">
      <path
        d="M 0 -35
           Q 30 -35, 30 0
           Q 30 35, 0 35
           Q -30 35, -30 0
           Q -30 -35, 0 -35 Z
           M 0 -25
           Q 20 -25, 20 0
           Q 20 25, 0 25
           Q -20 25, -20 0
           Q -20 -25, 0 -25 Z"
        fill-rule="evenodd"
        fill="url(#aiFluidCoreA)"
        transform="rotate(15)"
      />
      <circle cx="0" cy="0" r="38" fill="none" stroke="#A78BFA" stroke-width="1.2" opacity="0.4" stroke-dasharray="2 4"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#C4B5FD" stroke-width="1" opacity="0.3" stroke-dasharray="5 5"/>
      <circle cx="0" cy="0" r="34" fill="none" stroke="#EDE9FE" stroke-width="0.7" opacity="0.5" stroke-dasharray="1 3"/>
    </g>

    <g filter="url(#interventionShadowA)" transform="translate(0, -1)">
      <path d="M -15 -22 L -7 -22 C -5.5 -22, -4.5 -21, -4.5 -19.5 L -4.5 19.5 C -4.5 21, -5.5 22, -7 22 L -15 22 C -16.5 22, -17.5 21, -17.5 19.5 L -17.5 -19.5 C -17.5 -21, -16.5 -22, -15 -22 Z"
            fill="url(#interventionControlA)" stroke="#A16207" stroke-width="0.6"/>
      <path d="M 4.5 -22 L 12.5 -22 C 14 -22, 15 -21, 15 -19.5 L 15 19.5 C 15 21, 14 22, 12.5 22 L 4.5 22 C 3 22, 2 21, 2 19.5 L 2 -19.5 C 2 -21, 3 -22, 4.5 -22 Z"
            fill="url(#interventionControlA)" stroke="#A16207" stroke-width="0.6"/>
    </g>
  </g>
</svg>
