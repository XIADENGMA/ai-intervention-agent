name: Tests

on:
  push:
    branches:
      - main
      - develop
    # R181 — 删除 docs/** 与 **/*.md 的 paths-ignore：
    # 这两条原本是 "doc-only commits 不跑 CI" 的优化，但 v1.6.3 release
    # 失败暴露了一个隐藏成本：CHANGELOG.md 改动可以破坏 test_housekeeping_r151
    # / test_changelog_* 等 doc-aware guards，docs/*.md 改动可以破坏
    # test_docs_links_no_rot / test_generate_docs_index_prefix_r178 等。让
    # doc-only commit 仍跑完整 ci_gate.py（5 min / matrix）。LICENSE 与
    # ISSUE_TEMPLATE 没有 pytest guard，继续 ignore。
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  workflow_dispatch:

# 同一分支只保留最新一次运行，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 提前验证 GitHub Actions 在 Node.js 24 运行时的兼容性（2026-06-02 起将成为默认）
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # 审计模式下 harden-runner 仅记录 egress，不 block；样本够了再切 block
      - name: Harden runner（audit）
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: 检出代码
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: 设置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装 uv（带缓存）
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.9"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: 版本一致性检查（bump_version.py --check）
        if: matrix.python-version == '3.11'
        run: uv run python scripts/bump_version.py --check

      - name: 设置 Node.js（dependency audit）
        if: matrix.python-version == '3.11'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: 依赖安全审计（pip-audit + npm audit）
        if: matrix.python-version == '3.11'
        run: uv run python scripts/dependency_audit.py --gate pr

      - name: Python CI Gate（ruff/ty/pytest/coverage/minify）
        if: matrix.python-version == '3.11'
        run: uv run python scripts/ci_gate.py --ci --with-coverage --skip-version-check

      - name: Python CI Gate（ruff/ty/pytest/minify）
        if: matrix.python-version != '3.11'
        run: uv run python scripts/ci_gate.py --ci --skip-version-check

      - name: 上传覆盖率报告（coverage.xml）
        # 不用 always()：上游门禁（audit/gate）失败时 coverage.xml 必然
        # 不存在，跑上传只会在同一 job 里叠加第二个 failure 噪音，直接
        # skip。成功路径下文件缺失仍由 if-no-files-found: error fail-closed
        # 拦截（test_coverage_artifact_missing_file_fails_closed 守卫锁定），
        # coverage 静默停摆必被发现。
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
