name: Release

on:
  # 正式发布：推送语义化版本 tag（例如 v1.4.4）
  push:
    tags:
      - "v*.*.*"

  # 手动触发：默认只构建并上传产物（不发布/不创建 Release）
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  # 提前验证 GitHub Actions 在 Node.js 24 运行时的兼容性（2026-06-02 起将成为默认）
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (sdist + wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 审计模式下 harden-runner 仅记录 egress，不 block；样本够了再切 block
      - name: Harden runner（audit）
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: 安装 uv（带缓存）
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.9"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: 版本一致性检查（bump_version.py --check）
        run: uv run python scripts/bump_version.py --check

      - name: Python CI Gate（ruff/ty/pytest/minify）
        run: uv run python scripts/ci_gate.py --ci --skip-version-check

      - name: 构建（uv build）
        run: uv build --sdist --wheel --out-dir dist --clear

      - name: 校验产物（twine check）
        run: uv tool run twine check dist/*

      - name: 设置 Node.js（用于构建 VSCode 插件 VSIX）
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: 安装 Node 依赖（npm workspaces）
        run: npm ci

      - name: 依赖安全审计（release gate）
        run: uv run python scripts/dependency_audit.py --gate release

      - name: 安装 xvfb（VSCode 测试无头环境需要）
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: VSCode 插件：Check（Test + Package）
        run: xvfb-run -a npm run vscode:check

      - name: 上传构建产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: 上传 VSCode 插件产物（VSIX）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: packages/vscode/*.vsix
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI (Trusted Publisher)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    # 仅在 tag push 时发布；workflow_dispatch 默认不发布，避免误操作
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      actions: read
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/ai-intervention-agent/

    steps:
      # 审计模式下 harden-runner 仅记录 egress，不 block；样本够了再切 block
      - name: Harden runner（audit）
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 下载构建产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 10

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      actions: read
      contents: write
      # actions/attest 需要这两项：id-token 向 Sigstore 申请短期签名证书，
      # attestations 把证明写回 GitHub。只给这个不安装第三方依赖的 job；
      # build job（跑 npm ci / ci_gate）仍然没有它们。
      id-token: write
      attestations: write

    steps:
      # 审计模式下 harden-runner 仅记录 egress，不 block；样本够了再切 block
      - name: Harden runner（audit）
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 检出代码（用于生成 Release Notes）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 下载构建产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: 下载 VSCode 插件产物（VSIX）
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: vsix/

      # 先看这个 tag 现在的 Release 是什么状态：
      #   - 有草稿（多半是上次中断留下的）：不自动续用也不自动删（草稿里可能有
      #     手写的说明），报错让人看一眼；删掉草稿后重新运行这个 job 即可。
      #   - 已经发布（例如只重跑了后面失败的清理步骤）：这个 job 的活已经干完，
      #     后面的证明和发布步骤跳过。已发布的 immutable Release 本来就改不了，
      #     重新上传（--clobber）只会失败，对可变的 Release 则等于悄悄换文件。
      - name: 检查这个 tag 的 Release 状态
        id: state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          drafts="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            | jq -s --arg tag "$tag" '[.[][] | select(.draft and .tag_name == $tag)] | length')"
          if [[ "$drafts" != "0" ]]; then
            echo "::error::已经有 $tag 的草稿 Release（多半是上次中断留下的）。请在 Releases 页面删除它，再重新运行这个 job。"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "state=published" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $tag 已经发布，跳过证明和发布步骤"
          else
            echo "state=none" >> "$GITHUB_OUTPUT"
          fi

      # 给 sdist / wheel / VSIX 生成 SLSA 构建来源证明（artifact attestation）。
      # 证明绑定这次 workflow run 里每个文件的 sha256，所以用户拿到 PyPI 或
      # GitHub Release 上的同一份文件后可以自己核对：
      #   gh attestation verify <文件> --repo XIADENGMA/ai-intervention-agent
      - name: 生成构建来源证明（actions/attest）
        if: steps.state.outputs.state == 'none'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*
            vsix/*.vsix

      # bundle 要作为 Release 文件一起发布（离线也能核对），所以放在发布前；
      # 先对着刚生成的 bundle 离线核对一遍，签名身份必须是这个仓库的 release.yml。
      - name: 保存并核对证明 bundle
        if: steps.state.outputs.state == 'none'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p attestation
          bundle="attestation/ai-intervention-agent-${GITHUB_REF_NAME#v}.sigstore.json"
          cp "$BUNDLE_PATH" "$bundle"
          for f in dist/* vsix/*.vsix; do
            gh attestation verify "$f" \
              --bundle "$bundle" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done

      # GitHub 建议的顺序：建草稿 → 传齐所有文件 → 核对 → 最后才发布。
      # 开着 release immutability 时，发布的那一刻起 tag 和文件就再也改不了，
      # 所以核对必须在发布之前。
      - name: 创建 GitHub Release（草稿 → 上传 → 核对 → 发布）
        if: steps.state.outputs.state == 'none'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          files=(dist/* vsix/*.vsix "attestation/ai-intervention-agent-${tag#v}.sigstore.json")

          create_args=(--draft --verify-tag --title "$tag" --generate-notes)
          if [[ "$tag" == *-* ]]; then
            create_args+=(--prerelease)
          fi
          gh release create "$tag" "${create_args[@]}"
          # 草稿还没有 immutable 保护，上传可以放心进行
          gh release upload "$tag" "${files[@]}"

          # 核对：文件名集合和 sha256 必须与本地完全一致，不一致就在发布前失败
          want="$(for f in "${files[@]}"; do
            printf 'sha256:%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"
          done | sort)"
          have="$(gh release view "$tag" --json assets \
            | jq -r '.assets[] | "\(.digest)  \(.name)"' | sort)"
          if [[ "$want" != "$have" ]]; then
            echo "::error::Release $tag 上的文件和本地构建产物不一致（左：本地，右：Release）"
            diff <(printf '%s\n' "$want") <(printf '%s\n' "$have") || true
            exit 1
          fi

          gh release edit "$tag" --draft=false

          # 发布之后只做告知，不会让 job 失败：Release 已经发出去了，读不到的东西
          # 不该把这次发布变成红的（那样后面的清理步骤也会被跳过）。开着 release
          # immutability 时 isImmutable 是 true，release attestation 稍后就能被
          # gh release verify 查到。这几句用 notice 而不是 warning：没打开
          # immutability 是允许的状态，不是问题。
          immutable="$(gh release view "$tag" --json isImmutable 2>/dev/null \
            | jq -r '.isImmutable' 2>/dev/null || echo unknown)"
          case "$immutable" in
            true)
              verified=no
              for _ in 1 2 3 4 5 6; do
                if gh release verify "$tag" >/dev/null 2>&1; then
                  verified=yes
                  break
                fi
                sleep 5
              done
              if [[ "$verified" == yes ]]; then
                echo "::notice::Release $tag 是 immutable，release attestation 校验通过"
              else
                echo "::notice::Release $tag 是 immutable，但 30 秒内还没查到 release attestation；稍后手动运行 gh release verify $tag 确认"
              fi
              ;;
            false)
              echo "::notice::Release $tag 不是 immutable（仓库设置里没有打开 Enable release immutability）"
              ;;
            *)
              echo "::notice::读不到 Release $tag 的 isImmutable；稍后手动运行 gh release view $tag --json isImmutable 确认"
              ;;
          esac

      # 保持 Release 页只保留最近 3 个正式版本：更早的自动删除。
      # 仅删除 GitHub Release 条目（不带 --cleanup-tag），git tag /
      # CHANGELOG / PyPI / Open VSX 的历史版本
      # 全部保留；draft 与 prerelease 不参与统计也不会被删。
      - name: 清理旧 Release（保留最近 3 个正式版本，tag 全保留）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName,isDraft,isPrerelease,publishedAt \
            --jq '[.[] | select((.isDraft or .isPrerelease) | not)] | sort_by(.publishedAt) | reverse | .[3:] | .[].tagName' \
            > /tmp/stale_releases.txt
          while IFS= read -r old_tag; do
            [ -n "$old_tag" ] || continue
            echo "::notice::删除旧 Release：$old_tag（tag 保留）"
            gh release delete "$old_tag" --yes
          done < /tmp/stale_releases.txt

  open-vsx:
    name: Publish VSCode Extension to Open VSX
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      # 审计模式下 harden-runner 仅记录 egress，不 block；样本够了再切 block
      - name: Harden runner（audit）
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 下载 VSCode 插件产物（VSIX）
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: vsix/

      - name: 设置 Node.js（用于发布 Open VSX）
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: 发布到 Open VSX（从 VSIX 发布）
        if: env.OVSX_TOKEN != ''
        env:
          OVSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        # R149 — pin ovsx version. 2026-05-08 v1.6.0 release passed
        # with the floating "ovsx" tag; 2026-05-10 v1.6.1 release with
        # the same code shape failed because the floating tag picked
        # up a newer ovsx that strict-checked package.json
        # displayName vs vsixmanifest. Pinning to 0.10.9 (current
        # latest at time of R149) makes the publish step
        # deterministic and lets us upgrade ovsx via a tracked PR
        # rather than having silent toolchain drift break a release.
        # Bump this with R149 follow-up after verifying the new
        # ovsx version still publishes.
        run: |
          npx --yes ovsx@0.10.9 verify-pat xiadengma -p "$OVSX_TOKEN"
          npx --yes ovsx@0.10.9 publish -p "$OVSX_TOKEN" vsix/*.vsix

      - name: 跳过（OPEN_VSX_TOKEN 未配置）
        if: env.OVSX_TOKEN == ''
        env:
          OVSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: echo "::notice::OPEN_VSX_TOKEN secret not configured, skipping Open VSX publish"
