# Dependabot 配置
# 功能：自动检测依赖更新并创建 PR；PR 一律由人看过 CI 再合并（没有自动合并的 workflow）
# 检查频率：每月 1 日（monthly）。`schedule.day` 只对 weekly 有效，monthly 不能带，否则校验器报错。
#   安全更新（漏洞公布后的 PR）不受这里的 schedule 管，照旧立刻开。
#
# 审查者：这里不写 `reviewers:`。GitHub 已经移除了这个选项（2025-04-29 的 changelog
#   “Dependabot reviewers configuration option being replaced by code owners”），写了也不起作用。
#   Dependabot PR 上的 review 请求由 `.github/CODEOWNERS` 的 `* @xiadengma` 发出。
#
# 标签：`labels:` 只写仓库里真实存在的 `dependencies`。仓库里没有的标签（这里原来写的
#   `python`、`github-actions`、`npm`）GitHub 不会替你创建，Dependabot 直接忽略它们；
#   而配置了 `labels:` 就会取代 Dependabot 的默认标签，所以 `dependencies` 要明写。
#   想按生态区分标签：先在仓库里创建标签（Settings → Labels），再把它加到对应的 `labels:`。
#
# 关于 `groups:`：
#   把大量琐碎的 patch/minor 合成单 PR，显著降低 dependabot 噪音。
#   major 升级始终独立 PR（`update-types: ["major"]` 从默认 group 剔除），
#   方便人工审阅。

version: 2

updates:
  # Python 依赖更新
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    # PR 标签（为什么只有一个：见文件头的“标签”）
    labels:
      - 'dependencies'
    # 提交消息前缀
    commit-message:
      prefix: 'chore(deps)'
    # 限制每次最多创建的 PR 数量
    open-pull-requests-limit: 5
    groups:
      # 非大版本 → 单个 PR（含运行时 + 测试依赖；项目 deps 体量小，不再细分）
      python-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    # 忽略特定依赖（可选）
    # ignore:
    #   - dependency-name: "some-package"

  # GitHub Actions 版本更新
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(ci)'
    open-pull-requests-limit: 5
    groups:
      # 所有 action 升级合进一个 PR（只要不是 major），actionlint + release 一次验证
      actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # Node.js/npm 依赖更新 (负责根目录及 packages/vscode 插件)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps-npm)'
    open-pull-requests-limit: 5
    # 关于 `ignore`：
    #   `@types/vscode` 必须 ≤ `engines.vscode` 的最低支持版本，否则插件
    #   会用到运行时不存在的 API。详见 microsoft/vscode-vsce#506 与
    #   microsoft/vscode-vsce src/validation.ts 的 major.minor 强校验。
    #   因此把 @types/vscode 的所有 semver 升级都交给人工，与 engines.vscode
    #   一起手动 bump（避免再次出现 dependabot 反复把它升超 engine 的循环）。
    ignore:
      - dependency-name: '@types/vscode'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
    groups:
      # devDependencies（eslint/typescript/@vscode-* 等）噪音大，打包到一个 PR
      npm-dev-minor-and-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      # 运行时依赖（flask/werkzeug/pillow 等）数量少但更重要，单独成组，review 更严
      npm-prod-minor-and-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
